services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssa_backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DB_PATH: /data/db.sqlite3
    volumes:
      - sqlite_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/posts/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  sqlite_data: